name: Tenders
# Open tenders from international organisations, private companies and the public sector, read from official systems
# three times a day (the EU and EEA public sector's, some 40,000 notices, on the first run of the day and on manual
# runs) and uploaded to the site. The site accepts this workflow only on main (scheduled or manual), signed by GitHub
# for this exact repository, and only on its tenders routes.
on:
  schedule:
    - cron: "23 2,10,18 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: tenders
  cancel-in-progress: false
jobs:
  tenders:
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Collect tenders
        timeout-minutes: 70
        env:
          TENDERS_FULL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node tenders-runner.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tenders-report
          path: tenders-report.json
          if-no-files-found: ignore
          retention-days: 7
