name: Jobs
# Production Jobs collector: collects jobs from listed companies', governments' and international
# organisations' own career sites every six hours. The site accepts uploads only from this workflow
# on main (scheduled or manual), signed by GitHub for this exact repository; never from pull requests.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect and upload a report without publishing to the site"
        required: false
        type: boolean
        default: false
      sources:
        description: "Optional comma-separated registered source IDs (blank = all)"
        required: false
        type: string
permissions:
  id-token: write
  contents: read
concurrency:
  group: jobs
  cancel-in-progress: false
jobs:
  jobs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Automatic sources run first under a 3,000 s shared deadline (2,500 requests), then the
    # manual phase (~28 min measured). 120 minutes leaves a healthy margin.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.20.0
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_jobs_government.py'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .jobs-cache/
          key: discovered-sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: discovered-sources-v1-
      - run: node jobs-runner.mjs
        env:
          JOB_SOURCES: ${{ inputs.sources }}
          JOBS_DRY_RUN: ${{ (inputs.dry_run || vars.PUBLISH_RESULTS != 'true') && '1' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jobs-collection-report
          path: jobs-collection-report.json
          if-no-files-found: ignore
